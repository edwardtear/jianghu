<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#101514" media="(prefers-color-scheme: dark)">

<meta property="og:title" content="江湖一生 · One Life in the Jianghu">
<meta property="og:description" content="生在何处，由天不由你。一款武侠人生模拟器。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23a63727%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2262%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22serif%22%3E侠%3C/text%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: ink-wash header; a character scroll beside the year-by-year chronicle; a BitLife-style dock with the big "next year" seal; sheets slide up for activities, people and assets; a battle screen plays Namerena-style fights. */
:root{
  --paper:#E5E9E0; --paper-2:#D8DED3; --paper-3:#CBD3C6; --ink:#1A201F; --ink-2:#4B5551; --line:#B6C0B6;
  --seal:#A63727; --on-seal:#F6EEE6; --jade:#3B6E5E; --gold:#8F6E25; --blue:#2F5878; --plum:#7A3E62;
  --f-brush:"Ma Shan Zheng","Noto Serif SC","STKaiti","KaiTi",serif;
  --f-cn:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:"Alegreya",Georgia,"Times New Roman",serif;
  --f-label:"Alegreya Sans SC","Gill Sans",system-ui,sans-serif;
  --shadow:0 10px 40px rgba(20,30,28,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101514; --paper-2:#182020; --paper-3:#222C2A; --ink:#DCE3DA; --ink-2:#9BA8A1; --line:#2E3936;
  --seal:#D25B47; --on-seal:#1A0F0C; --jade:#7DB39F; --gold:#D2AD5C; --blue:#7FA9CF; --plum:#C98AB0; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101514; --paper-2:#182020; --paper-3:#222C2A; --ink:#DCE3DA; --ink-2:#9BA8A1; --line:#2E3936;
  --seal:#D25B47; --on-seal:#1A0F0C; --jade:#7DB39F; --gold:#D2AD5C; --blue:#7FA9CF; --plum:#C98AB0; --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55}
body.zh{--f-body:"Noto Serif SC","Songti SC","SimSun",serif;--f-label:"Noto Serif SC","Songti SC","SimSun",serif;font-size:16px;line-height:1.8}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cn{font-family:var(--f-cn)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.lbl{font-family:var(--f-label);font-size:12.5px;letter-spacing:.08em;color:var(--ink-2);text-transform:lowercase}
body.zh .lbl{text-transform:none;letter-spacing:.04em}
.muted{color:var(--ink-2)}

/* header */
header{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#hills{position:absolute;inset:0;width:100%;height:100%;display:block}
.head{position:relative;display:flex;align-items:flex-end;gap:18px;padding-block:44px 18px;flex-wrap:wrap}
@media (max-width:520px){.head{padding-block:58px 16px}}
.brand{font-family:var(--f-brush);font-size:clamp(46px,8vw,80px);line-height:.9;margin:0;font-weight:400;letter-spacing:.04em}
.tag{max-width:40ch;margin:0 0 4px}
.tag b{font-family:var(--f-label);letter-spacing:.08em;font-size:15px;display:block;color:var(--seal)}
.tag span{color:var(--ink-2);font-size:15px}
.topbar{position:absolute;z-index:2;top:10px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--ink);background:var(--paper);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:14px;line-height:1.3}
.chip.on,.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg .chip{border:0;border-radius:0}

/* main */
main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:30px;padding-block:22px 0}
@media (max-width:880px){main{grid-template-columns:minmax(0,1fr);gap:14px}}
aside{align-self:start;min-width:0}
details.sec{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);padding:4px 0;min-height:32px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'▾';transition:transform .2s ease}
details.sec:not([open])>summary::after{transform:rotate(-90deg)}
details.sec .fightbox{margin-top:4px;padding-top:0;border-top:0}
details.sec .tal{margin-top:6px}
.who{display:flex;gap:14px;align-items:center}
.seal{flex:none;width:56px;min-height:56px;background:var(--seal);color:var(--on-seal);border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-brush);font-size:22px;line-height:1.02;writing-mode:vertical-rl;padding:6px 4px;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 4.5px var(--on-seal)}
.who h2{margin:0;font-size:25px;line-height:1.1;font-weight:500}
.who p{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}
.odds{margin:12px 0 0;font-size:14.5px;color:var(--ink-2);border-left:2px solid var(--seal);padding-left:10px}
.odds b{color:var(--ink);font-variant-numeric:tabular-nums}
.agebox{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cnage{font-family:var(--f-brush);font-size:38px;line-height:1}
.realm{text-align:right}.realm .cn{font-size:19px;font-weight:600;display:block;line-height:1.25}.realm small{color:var(--ink-2);font-size:13.5px}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:12px}
.bar .row{display:flex;justify-content:space-between;font-size:14px;gap:6px}.bar .row b{font-variant-numeric:tabular-nums;font-weight:500}
.track{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-top:3px}
.fill{height:100%;border-radius:3px;transition:width .4s ease}
.f-hp{background:var(--seal)}.f-atk{background:var(--seal);opacity:.75}.f-spd{background:var(--gold);opacity:.7}.f-res{background:var(--ink-2)}.f-joy{background:var(--gold)}.f-sm{background:var(--blue)}.f-lk{background:var(--plum)}.f-pw{background:var(--jade)}
.bar.wide{grid-column:1/-1}
.money{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:8px 10px;background:var(--paper-2);border-radius:4px;font-variant-numeric:tabular-nums}
.money b{font-size:19px;font-weight:500}
.yl p.news{font-size:14.5px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--line)}
.ledger{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}@media (max-width:520px){.ledger{grid-template-columns:minmax(0,1fr)}}
.lgrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}.lgrow.total{border-bottom:0;margin-top:6px;font-size:15px}.lgrow b{font-weight:500;font-variant-numeric:tabular-nums}.lgrow .pos{color:var(--jade)}.lgrow .neg{color:var(--seal)}
.worldln{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}.worldln b{color:var(--ink);font-weight:500}
.orgbox{margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--seal);border-radius:4px}.orgbox b{font-weight:600}.orgbox .lbl{display:block}
.orgst{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}.orgst b{color:var(--ink);font-weight:500}
.quests{margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--gold,#b8892e);border-radius:4px}
.quests ul{margin:4px 0 0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.qgos{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0 4px}.qgo{font-size:12.5px;padding:2px 9px}.qwait{font-size:12px;color:var(--ink-2)}
.tal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:14px}
.tal .t{display:flex;justify-content:space-between;font-size:14px}
.pips{display:flex;gap:2px;margin-top:4px}.pips i{flex:1;height:5px;background:var(--paper-2);border-radius:1px}.pips i.on{background:var(--ink)}.pips i.on.hi{background:var(--gold)}
dl.st{margin:14px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14.5px;padding-top:12px;border-top:1px solid var(--line)}
dl.st dt{font-family:var(--f-label);font-size:12.5px;letter-spacing:.06em;color:var(--ink-2);padding-top:2px}
dl.st dd{margin:0;min-width:0}
.align{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--seal),var(--paper-2) 50%,var(--jade));margin:6px 0 2px}
.align i{position:absolute;top:-4px;width:3px;height:14px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.alignlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.arts{display:flex;flex-wrap:wrap;gap:5px}
.art{font-size:13px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;background:var(--paper)}
.art.t2,.art.t3{border-color:var(--gold);color:var(--gold)}.art.bad{border-color:var(--seal);color:var(--seal)}
.warnrow{color:var(--seal)}

/* chronicle */
.chron{min-width:0;padding-bottom:28px}
.yr{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding-block:11px;border-bottom:1px dashed var(--line);animation:inkin .45s ease both}
@keyframes inkin{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.yr{animation:none}.fill{transition:none}}
.yh .cnage{font-size:24px;display:block;white-space:nowrap}.yh small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.3;margin-top:3px}
.yl p{margin:0 0 5px;max-width:68ch}
.yr.latest{border-left:3px solid var(--seal);padding-left:10px;margin-left:-13px;border-bottom:1px solid var(--line)}
@media (max-width:520px){.yr.latest{margin-left:0;padding-left:8px}}.yl p:last-child{margin-bottom:0}
body.zh .yl p{max-width:42em}
.yl p.muted{color:var(--ink-2);font-style:italic}.yl p.bad{color:var(--seal)}.yl p.good{color:var(--jade)}
.yl p.gold{color:var(--gold);font-weight:500}
.yl p.prompt{font-weight:500}
.yr.latest .yl .ev.new{background:var(--paper-2);border-radius:6px;padding:6px 8px;margin:0 -8px}
.yl .ev+.ev{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.yl p.prompt.follow{border-top:0;margin-top:4px;padding-top:0}.yl p.prompt.follow::before{content:'↳ ';color:var(--ink-2)}
.bio{font-size:15px;line-height:1.75;margin:10px 0 12px;padding:10px 12px;background:var(--paper-2);border-radius:6px}.bio h4{margin:0 0 4px;font-size:13px;color:var(--ink-2);font-weight:500}
.who p.loc{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.fin{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:9px 10px;margin:4px 0;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.topbar .chip[hidden]{display:none}
.qtale{color:var(--gold,#b8892e)}
.lore-sec{margin:22px 0 4px;font-size:16px}
.slot{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0}.slot.cur{border-color:var(--gold,#b8892e);border-width:2px}
.slot-h{display:flex;justify-content:space-between;align-items:baseline}.slot p{margin:4px 0;font-size:14px}.slot-who{font-size:15px}
.slot-b{display:flex;gap:8px;align-items:center;margin-top:6px}.slot .btn{flex:1}.slot>.btn{width:100%;margin-top:6px}
.sx{font-size:.82em;margin-left:3px;font-weight:700}.sx-m.sx{color:#3f6f9a}.sx-f.sx{color:#b04a6a}
.av.sx-m{box-shadow:inset 0 0 0 2px rgba(63,111,154,.55)}.av.sx-f{box-shadow:inset 0 0 0 2px rgba(176,74,106,.55)}
.sndrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0;font-size:15px}.sndrow input{flex:1;max-width:220px}
.lorebtn{display:block;width:100%;margin:12px 0 4px;text-align:left}
.lore{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0}.lore.unseen{opacity:.6}
.lore-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.lore p{margin:4px 0 6px;font-size:13.5px}
.lore-now{font-size:12px;color:var(--ink-2)}.lore-now.on{color:var(--gold,#b8892e)}
.lore-ends{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}.lore-ends li{font-size:12.5px;border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.lore-ends li.locked{color:var(--ink-2);border-style:dashed}.lore-ends li.t-good{border-color:var(--gold,#b8892e)}.lore-ends li.t-bad{border-color:#a63727}

.tip{cursor:help;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent)}
#tipcard{position:fixed;box-sizing:border-box;max-width:calc(100vw - 24px);z-index:60;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px;line-height:1.5}
#tipcard p{margin:4px 0 8px}#tipcard b{font-size:15px}

.memlist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}.memlist li{font-size:13.5px;border-left:2px solid var(--line);padding-left:8px}.memlist small{display:block;color:var(--ink-2);font-size:12px}
.qfrom{font-size:12px;color:var(--ink-2);margin:0 0 4px}
.yl p.you{padding-left:10px;border-left:2px solid var(--ink-2);color:var(--ink-2);font-size:15px}
.yl p.act{font-family:var(--f-label);font-size:13.5px;letter-spacing:.04em;color:var(--ink-2);margin-top:8px}
.yl p.fight{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.yl p.fight.win{color:var(--jade)}.yl p.fight.lose{color:var(--seal)}
.watch{border:1px solid currentColor;background:transparent;border-radius:3px;font-size:12.5px;padding:0 6px;cursor:pointer;line-height:1.5;color:inherit}
@media (max-width:520px){.yr{grid-template-columns:minmax(0,1fr);gap:2px}.yh{display:flex;gap:10px;align-items:baseline}.yh small{margin:0}}
.choices{display:grid;gap:8px;margin:6px 0 10px;padding:14px;border:1.5px solid var(--seal);border-radius:6px;background:var(--paper-2)}
.choices .lbl{color:var(--seal)}
.qtext{margin:0 0 4px;font-weight:500;max-width:68ch}
.choice{display:block;width:100%;text-align:left;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.choice:hover{border-color:var(--ink)}
.choice b{font-weight:500;display:block}.choice span{font-size:14px;color:var(--ink-2);display:block}
.risk{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-top:3px;padding:1px 7px;border-radius:3px;background:var(--paper-2);font-variant-numeric:tabular-nums}
.risk.r0{color:var(--jade)}.risk.r1{color:var(--gold)}.risk.r2{color:var(--seal)}

/* epitaph */
.tomb{display:flex;gap:20px;margin:4px 0 14px;padding:20px;border:1px solid var(--ink);border-radius:4px;background:var(--paper-2);flex-wrap:wrap}
.stele{flex:none;writing-mode:vertical-rl;font-family:var(--f-brush);font-size:34px;line-height:1.15;padding:10px 8px;border-left:1px solid var(--line);border-right:1px solid var(--line);letter-spacing:.08em}
.ep{flex:1;min-width:220px}.ep h3{margin:0;font-size:24px;font-weight:500}
.ep .title{color:var(--seal);font-family:var(--f-cn);font-weight:600;margin:4px 0 10px}
.ep p{margin:0 0 8px;max-width:62ch}.ep ul{margin:6px 0 12px;padding-left:18px}
.grid3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0;font-variant-numeric:tabular-nums}
.grid3 b{display:block;font-size:19px;font-weight:500}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hall{margin-top:22px}.hall h4{margin:0 0 6px;font-weight:500;font-size:16px}
.hall ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.hall li{display:flex;gap:10px;justify-content:space-between;font-size:14.5px;border-bottom:1px dotted var(--line);padding-bottom:3px;flex-wrap:wrap}
.hall li span:last-child{color:var(--ink-2)}


/* phones */
#ministat{display:none}
.mini{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);padding:7px 10px;cursor:pointer;color:var(--ink);font:inherit}
.mtop{display:flex;align-items:baseline;gap:8px;font-size:14px;white-space:nowrap;overflow:hidden}.mtop b{font-size:16px;font-weight:600}
.mrealm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}.mmoney{font-variant-numeric:tabular-nums}.mq{color:var(--seal);font-size:12.5px}.mmore{margin-left:auto;color:var(--ink-2);font-size:12.5px}
.mbars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.mb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}.ml{flex:none}
.mt{flex:1;height:5px;background:var(--paper-3);border-radius:3px;overflow:hidden}.mt i{display:block;height:100%}
.sidesheet .who{margin-top:2px}
@media (max-width:620px){
 #side{display:none}
 #ministat{display:block;position:sticky;top:0;z-index:15;background:var(--paper);padding:6px 0 8px;margin:0 0 4px}
 .wrap{padding-inline:max(12px,env(safe-area-inset-left,0px))}
 main{gap:6px;padding-top:6px}
 body.jh-play .head{padding-block:44px 6px;gap:6px}
 body.jh-play .brand{font-size:30px}
 body.jh-play .tag{display:none}
 .topbar .chip{padding:4px 9px;font-size:13px}
 .choices{padding:12px}
 .choice{padding:10px 12px}
 .yl p{font-size:15.5px;line-height:1.65}
 .focusbar{padding:8px 10px;gap:4px}.focusbar .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.focusbar .fchips::-webkit-scrollbar{display:none}.focusbar .fchips .chip{flex:none}
 .dock .age{width:74px;height:74px;margin-top:-24px}
 .dock .age #d-ap{font-size:12px;letter-spacing:0}
 .dock .tab{font-size:12px}.dock .tab .ico{width:32px;height:32px;font-size:20px}
}
/* dock */
.dock{position:sticky;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:6px;align-items:center;padding-block:8px;max-width:720px}
